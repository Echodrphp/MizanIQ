<svg viewBox="0 0 140 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gauge arc - light for dark bg -->
  <path d="M 15 70 A 40 40 0 0 1 95 70" stroke="#A0AEC0" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Tick marks -->
  <line x1="20" y1="56" x2="26" y2="58" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="44" x2="30" y2="47" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
  <line x1="34" y1="34" x2="39" y2="38" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
  <line x1="47" y1="28" x2="49" y2="34" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
  <!-- Cyan circuit arc -->
  <path d="M 58 24 A 40 40 0 0 1 95 70" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Circuit nodes -->
  <circle cx="60" cy="25" r="3" fill="#38BDF8"/>
  <circle cx="72" cy="22" r="3" fill="#38BDF8"/>
  <circle cx="83" cy="26" r="2.5" fill="#38BDF8"/>
  <circle cx="90" cy="35" r="2.5" fill="#38BDF8"/>
  <!-- Circuit lines -->
  <line x1="60" y1="25" x2="72" y2="22" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="72" y1="22" x2="83" y2="26" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="83" y1="26" x2="90" y2="35" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- Trending arrow -->
  <polyline points="32,62 48,48 60,54 80,32" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="80,32 71,35 74,42" fill="#38BDF8"/>
  <!-- Needle pivot circle -->
  <circle cx="55" cy="70" r="5" fill="#A0AEC0" stroke="#718096" stroke-width="2"/>
  <!-- Triangle needle -->
  <polygon points="55,72 43,88 67,88" fill="#718096"/>
  <polygon points="55,72 49,88 61,88" fill="#A0AEC0" opacity="0.4"/>
</svg>
